name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtbase5-dev-tools \
            qt5-qmake \
            libqt5opengl5-dev \
            libgmp-dev \
            libmpfr-dev \
            libopenvdb-dev \
            libopenexr-dev \
            libilmbase-dev \
            libcgal-dev \
            cmake \
            build-essential

      - name: Install linuxdeploy and Qt plugin
        run: |
          # Download main linuxdeploy
          wget -O linuxdeploy-x86_64.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          sudo mv squashfs-root /opt/linuxdeploy
          
          # Download the Qt plugin
          wget -O linuxdeploy-plugin-qt-x86_64.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
          ./linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract
          # Merge the plugin files into the same /opt/linuxdeploy directory
          sudo cp -r squashfs-root/usr/bin/* /opt/linuxdeploy/usr/bin/
          
          echo "/opt/linuxdeploy/usr/bin" >> $GITHUB_PATH

      - name: Bootstrap submodules
        run: |
          git submodule update --init --recursive
          ./scripts/bootstrap-submodules.sh

      - name: Build bundled dependencies
        run: |
          ./scripts/build-bundled-deps.sh

      - name: Build project
        run: |
          qmake autoremesher.pro CONFIG+=release
          make -j$(nproc)

      - name: Package AppImage
        run: |
          ./packaging/appimage/package-appimage.sh ./autoremesher

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: AutoRemesher-${{ github.sha }}-x86_64.AppImage
          path: packaging/appimage/dist/AutoRemesher-x86_64.AppImage
          retention-days: 30

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/appimage/dist/AutoRemesher-x86_64.AppImage
          name: AutoRemesher-${{ github.ref_name }}-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openexr
            mingw-w64-x86_64-openvdb
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.*'
          target: 'desktop'
          arch: 'win64_mingw81'

      - name: Bootstrap submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          bash ./scripts/bootstrap-submodules.sh
        shell: msys2 {0}

      - name: Build bundled dependencies
        run: |
          ln -s /mingw64/bin/mingw32-make.exe /mingw64/bin/make.exe
          mkdir -p thirdparty/.artifacts/zlib
          cd thirdparty/zlib
          ./configure --prefix="$(pwd)/../.artifacts/zlib" --static
          make -j4
          make install
          touch ../.artifacts/.stamp
        shell: msys2 {0}

      - name: Build project
        run: |
          export PATH="$(cygpath -u "$QT_ROOT_DIR")/bin:$PATH"
          qmake autoremesher.pro CONFIG+=release
          mingw32-make -j$(nproc)
        shell: msys2 {0}

      - name: Create zip package
        run: |
          Compress-Archive -Path autoremesher.exe -DestinationPath AutoRemesher-${{ github.sha }}-x86_64-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AutoRemesher-${{ github.sha }}-x86_64-windows.zip
          path: AutoRemesher-${{ github.sha }}-x86_64-windows.zip
          retention-days: 30

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: AutoRemesher-${{ github.sha }}-x86_64-windows.zip
          name: AutoRemesher-${{ github.ref_name }}-x86_64-windows.zip